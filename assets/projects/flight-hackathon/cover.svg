  <path d="M60 300 C140 280 170 240 200 210 S230 120 250 60 S380 40 420 90 S470 200 560 170 S600 90 600 70" fill="none" stroke="#f0cf7a" stroke-width="3" stroke-dasharray="10 8"/>
